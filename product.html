<style>
@font-face{font-family:'Instrument Sans';src:url(lib/st-fonts/instrument-sans-var-latin.woff2) format('woff2');font-weight:400 700}
:root{--paper:#0B1020;--muted:#465065;--blue:#2757E6;--bar:#E6E8ED;--hair:rgba(11,16,32,.14);--roofer:#0D6C99}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--paper);display:flex;flex-direction:column;
  background:radial-gradient(ellipse 60% 48% at 50% 40%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
  linear-gradient(180deg,#B9BEC9 0%,#D5D9E0 30%,#ECEEF2 62%,#F7F8FA 100%)}
/* ONE header, roofer-led, in the page bar's own pill style (c4-command-deck/dk.css .bar) */
header{display:flex;align-items:center;gap:16px;height:64px;padding:0 24px;background:rgba(230,232,237,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.co{display:flex;align-items:center;gap:12px;min-width:0;flex:none}
.co .mark{width:36px;height:36px;border-radius:10px;background:var(--roofer);display:grid;place-items:center;flex:none}
.co .mark svg{width:20px;height:20px}
.co b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;line-height:1.15}
.co small{display:block;font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap}
nav{display:flex;gap:4px;margin-left:8px;padding:4px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid var(--hair);overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;flex:none;font:inherit;font-size:13.5px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;transition:background .2s ease,color .2s ease}
nav button:hover{background:rgba(255,255,255,.9);color:var(--paper)}
nav button.on{background:var(--paper);color:#fff}
nav button:focus-visible,.find:focus-within,.me:focus-visible{outline:2px solid #1F47C9;outline-offset:2px}
.sp{flex:1}
.find{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.7);color:var(--muted);font-size:13px;width:220px;flex:none}
.find svg{width:15px;height:15px;flex:none}
.find input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;color:var(--paper);outline:none}
.find input::placeholder{color:var(--muted)}
.sig{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.sig svg{width:13px;height:13.6px}
.sig b{color:var(--paper);font-weight:600}
.me{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;border:1px solid var(--hair);flex:none}
main{flex:1;display:flex;justify-content:center;align-items:center;padding:12px 12px 12px;min-height:0}
/* the stage holds one kept-alive frame per screen; switching screens is a fade out / rise in, never a reload */
.stage{position:relative;width:100%;height:100%;border-radius:14px;background:#fff;box-shadow:0 10px 40px rgba(11,16,32,.12);transition:width .3s ease,border-radius .3s ease;overflow:hidden}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transform:translateY(16px);visibility:hidden;pointer-events:none;
  transition:opacity .4s ease-out,transform .4s ease-out,visibility 0s linear .4s}
.frame.on{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:0s}
.frame.out{opacity:0;transform:none;visibility:visible;transition:opacity .3s ease-out,visibility 0s linear .3s}
.frame.parked{display:none}   /* parked frames keep their document and state but stop painting */
main.phone .stage{width:390px;height:min(844px,100%);border-radius:28px}
@media (prefers-reduced-motion:reduce){.frame,.frame.out,.stage{transition:none}}
@media (max-width:1180px){.sig{display:none}.find{width:170px}}
@media (max-width:900px){
  header{flex-wrap:wrap;height:auto;padding:8px 14px 8px;gap:8px 10px}
  .co{order:0}.sp{order:1}.find{order:2;width:36px;padding:0;justify-content:center}.find input{display:none}.me{order:3}
  nav{order:5;flex:1 1 100%;margin:0;max-width:none}
}
@media (max-width:599px){
  header{padding:8px 14px 4px;gap:6px 8px}
  .find{width:44px;height:44px;order:2}
  .me{width:44px;height:44px;order:3}
  main{padding:6px 8px 8px}
  .co{flex:1 1 0;min-width:0}.co>div{min-width:0}.co .mark{width:32px;height:32px}.co b{font-size:14px;overflow:hidden;text-overflow:ellipsis}.co small{font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  .sp{display:none}
  nav{background:transparent;border:0;padding:0;margin:0 -14px;padding:0 14px}
  nav{justify-content:space-between}
  nav button{padding:8px 12px;font-size:14px;min-height:44px;flex:1 1 0}
  .frame{border-radius:10px}
}
</style>
</head>
<body>
<header>
  <div class="co"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12.5 12 5l9 7.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 11v7.5h11V11" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M6 21h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".55"/></svg></span><div><b id="coName">Roof Command</b><small id="coArea">Roof Command</small></div></div>
  <nav id="nav" aria-label="Screens"></nav>
  <span class="sp"></span>
  <label class="find" id="find" title="Find an address or storm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="findIn" type="search" placeholder="Find an address or storm" autocomplete="off" aria-label="Find an address or ask Nimbus"></label>
  <div class="sig">Powered by <svg viewBox="0 0 63 66" aria-hidden="true"><path fill="#2757E6" d="M 0 3 Q 0 0 3 0 L 27 0 Q 30.5 0 30.5 3.5 L 30.5 28.5 Q 30.5 33.5 35.5 33.5 L 60 33.5 Q 63 33.5 63 36.5 L 63 63 Q 63 66 60 66 L 36 66 Q 32.5 66 32.5 62.5 L 32.5 37.5 Q 32.5 32.5 27.5 32.5 L 3 32.5 Q 0 32.5 0 29.5 Z"/></svg><b>Wing Digital</b></div>
  <div class="me" id="me" title="" tabindex="0"></div>
</header>
<main id="main"><div class="stage" id="f"></div></main>
<script src="lib/rc-state.js"></script>
<script src="lib/brand.js"></script>
<script src="lib/wing-mascot.js"></script>
<script src="lib/nimbus-shell.js"></script>
<script src="lib/auth.js"></script>
<script>
/* One shell, real routes. #/opening (About), #/storm, #/storm/<iso>, #/daily, #/daily/<n>, #/ask (?q=), and the CRM:
   #/crm (inbox), #/crm/inbox/<id> (a thread open), #/crm/pipeline (the board), #/crm/home/<id> (one home's record).
   #/home/<id> still works as an alias of #/crm/home/<id> (RC.go('home', {id}) from Today, Storms and Nimbus).
   Every route is a history entry, so Back moves between screens and never leaves the app.
   Frames ask for a screen with RC.go() (postMessage {type:'go'}) and the shell routes it. ?tab= deep links still work. */
/* opening = the first-run intro (and #/opening/about), never a nav tab */
const screens={
  opening:{label:'About Roof Command',page:'1a-storm-intro.html'},
  storm:{label:'Storms',page:'1b-storm-theater.html'},
  daily:{label:'Today',page:'c4-command-deck/deck.html'},
  home:{label:'CRM',page:'c5-home/index.html',path:'crm'},   /* screen key stays 'home' (RC.go('home') everywhere); the URL says crm */
  ask:{label:'Ask',page:'c2-nimbus/index.html'}
};
const ALIAS={crm:'home'};
const ORDER=['daily','storm','home','ask'];
const nav=document.getElementById('nav'),stage=document.getElementById('f'),main=document.getElementById('main');
const PLACEHOLDER='<!doctype html><meta charset=utf-8><style>@font-face{font-family:"Instrument Sans";src:url(lib/st-fonts/instrument-sans-var-latin.woff2) format("woff2");font-weight:400 700}body{margin:0;height:100vh;display:grid;place-items:center;font-family:"Instrument Sans",system-ui,sans-serif;color:#0B1020;background:#F7F8FA}div{text-align:center;max-width:420px;padding:24px}h1{font-size:22px;font-weight:600;margin:0 0 8px}p{margin:0;color:#465065;line-height:1.5}</style><div><h1>The CRM screen is being built</h1><p>Every conversation, the pipeline and each home with its roof. Check back shortly.</p></div>';
const q=new URLSearchParams(location.search);
const NOINTRO=q.get('nointro')==='1';
const NOPREFETCH=q.get('noprefetch')==='1';   // capture scripts on a software GPU: do not warm the next screen
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=null,briefed=false;
const frames={};            // screen -> {el, src, loaded}
const PREFETCH={daily:'home',storm:'daily',home:'daily',ask:'storm'};
window.__switch={last:0};   // tab-switch timing for the Playwright check

/* ---- routes ---- */
/* the CRM's segment: '' (inbox) | inbox/<id> | pipeline | home/<id>; an id with no view = that home's record (the old route) */
function crmSeg(params){
  const id=params.id?encodeURIComponent(params.id):'';
  if(params.view==='pipeline') return 'pipeline';
  if(params.view==='inbox') return id?'inbox/'+id:'';
  return id?'home/'+id:'';
}
function hashFor(screen,params){
  params=params||{};
  if(screen==='home'){ const seg=crmSeg(params); return '#/'+screens.home.path+(seg?'/'+seg:''); }
  const seg=screen==='storm'?params.iso:screen==='daily'?params.n:screen==='opening'&&params.about?'about':'';
  const qs=screen==='ask'&&params.q?'?q='+encodeURIComponent(params.q):'';
  return '#/'+screen+(seg?'/'+encodeURIComponent(seg):'')+qs;
}
function parseHash(h){
  const m=/^#\/([a-z]+)(?:\/([^?]+))?(?:\?(.*))?$/.exec(h||'');
  if(!m) return null;
  const screen=ALIAS[m[1]]||m[1]; if(!screens[screen]) return null;
  const seg=m[2]?decodeURIComponent(m[2]):'',params={};
  if(screen==='storm'&&seg) params.iso=seg;
  if(screen==='daily'&&seg) params.n=seg;
  if(screen==='home'){
    const t=seg?seg.split('/'):[];
    if(m[1]==='home'){ if(t[0]){ params.view='home'; params.id=t[0]; } }   /* #/home/<id>: the old route, one home's record */
    else if(t[0]==='pipeline') params.view='pipeline';
    else if(t[0]==='home'&&t[1]){ params.view='home'; params.id=t[1]; }
    else if(t[0]==='inbox'){ params.view='inbox'; if(t[1]) params.id=t[1]; }
    else if(t[0]){ params.view='home'; params.id=t[0]; }
  }
  if(screen==='ask'){const p=new URLSearchParams(m[3]||''); if(p.get('q')) params.q=p.get('q');}
  if(screen==='opening'&&seg==='about') params.about='1';
  return {screen,params};
}
function srcFor(screen,params){
  const s=screens[screen],p=new URLSearchParams();
  if(screen==='storm'&&params.iso) p.set('storm',params.iso);
  if(screen==='daily'&&params.n) p.set('n',params.n);
  if(screen==='home'){ if(params.id) p.set('home',params.id); if(params.view) p.set('view',params.view); }
  if(screen==='ask'&&params.q) p.set('q',params.q);
  if(screen==='opening'){ if(params.about) p.set('about','1'); else p.set('short','1'); }
  const qs=p.toString();
  return s.page+(qs?'?'+qs:'');
}
/* go: push a history entry (the user asked for a screen); render: draw whatever the hash says */
function go(screen,params,replace){
  const h=hashFor(screen,params);
  window.__switch.t0=performance.now();
  if(h===location.hash){ render(); return; }
  if(replace){ history.replaceState(null,'',location.pathname+location.search+h); render(); }
  else location.hash=h;
}
/* one frame per screen, made on first visit and kept alive; a frame's URL only changes when its params change */
function frameFor(screen){
  let fr=frames[screen]; if(fr) return fr;
  const el=document.createElement('iframe'); el.className='frame'; el.title='Roof Command: '+screens[screen].label; el.dataset.screen=screen;
  stage.appendChild(el);
  fr=frames[screen]={el,src:'',loaded:false,routeAck:null};
  el.addEventListener('load',()=>{ fr.loaded=true; if(cur===screen){ window.__switch.last=Math.round(performance.now()-(window.__switch.t0||performance.now())); settle(screen); }
    else setTimeout(()=>{ if(cur!==screen){ el.classList.add('parked'); tell(fr,{type:'visibility',hidden:true}); } },2500); });   // a prefetched frame sizes itself first, then parks
  return fr;
}
function load(fr,src){
  fr.src=src; fr.loaded=false;
  fr.el.removeAttribute('srcdoc');
  try{ fr.el.contentWindow.location.replace(new URL(src,location.href).href); }catch(e){ fr.el.src=src; }
}
/* a param change on a frame that is already on the right page: tell it, and only reload if it does not answer */
function route(fr,src,params){
  const samePage=fr.src.split('?')[0]===src.split('?')[0];
  if(fr.loaded&&samePage&&fr.el.contentWindow){
    fr.src=src; const token=Math.random().toString(36).slice(2);
    fr.routeAck=token;
    try{ fr.el.contentWindow.postMessage({type:'route',params,token},location.origin); }catch(e){}
    setTimeout(()=>{ if(fr.routeAck===token){ fr.routeAck=null; load(fr,src); } },350);
  } else load(fr,src);
}
function render(){
  if(!RCT_AUTH.ok()) return;   /* signed out: no frame (and no data) until lib/auth.js lets the shell in */
  const r=parseHash(location.hash)||{screen:'daily',params:{}};
  const screen=r.screen,params=r.params,s=screens[screen];
  if(screen==='home'&&/^#\/home(\/|$)/.test(location.hash)){ const canon=hashFor(screen,params); if(canon!==location.hash) history.replaceState(null,'',location.pathname+location.search+canon); }   /* the old #/home/<id> reads as #/crm/home/<id> */
  const quiet=cur===screen, prev=cur;
  cur=screen;
  [...nav.children].forEach(b=>{const on=b.dataset.screen===screen;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  Nimbus.setScreen(screen,quiet);
  if(screen==='opening'){ Nimbus.hideAll(); }
  else if(!Nimbus.isArrived()) Nimbus.arrive(null);
  const fr=frameFor(screen), src=srcFor(screen,params);
  if(screen==='home'&&!fr.src){
    fetch(s.page,{method:'HEAD',cache:'no-store'}).then(x=>{ if(x.ok) load(fr,src); else { fr.el.srcdoc=PLACEHOLDER; fr.src=src; } }).catch(()=>{ fr.el.srcdoc=PLACEHOLDER; fr.src=src; });
  } else if(src!==fr.src) route(fr,src,params);
  else if(screen==='opening'&&fr.loaded&&!quiet) load(fr,src);   // the opening replays from the top
  /* website-style transition: outgoing fades, incoming rises 16 px */
  if(prev&&prev!==screen&&frames[prev]){ const o=frames[prev].el; o.classList.remove('on'); o.classList.add('out'); tell(frames[prev],{type:'visibility',hidden:true});
    setTimeout(()=>{ o.classList.remove('out'); if(cur!==prev) o.classList.add('parked'); },reduced?0:320); }
  Object.keys(frames).forEach(k=>{ if(k!==screen){ frames[k].el.classList.remove('on'); if(k!==prev) frames[k].el.classList.add('parked'); } });
  fr.el.classList.remove('parked'); void fr.el.offsetWidth; fr.el.classList.add('on');   // reflow first so a brand-new frame still rises in
  tell(fr,{type:'visibility',hidden:false});
  if(fr.loaded&&src===fr.src){ window.__switch.last=Math.round(performance.now()-(window.__switch.t0||performance.now())); settle(screen); }
}
/* a frame moved on its own (next stop, next home, a storm picked on the timeline): keep the URL true without touching the frame */
function syncRoute(screen,params){
  const fr=frames[screen]; if(!fr||cur!==screen) return;
  fr.src=srcFor(screen,params);
  const h=hashFor(screen,params); if(h===location.hash) return;
  history.replaceState(null,'',location.pathname+location.search+h);
}
function tell(fr,msg){ try{ fr.el.contentWindow.postMessage(msg,location.origin); }catch(e){} }
/* after the screen you asked for has loaded, warm the one you are most likely to open next */
function settle(screen){
  if(pendingBrief&&screen==='daily') sayBrief();
  if(pendingFind&&screen===findTarget()){ const m=pendingFind; pendingFind=null; setTimeout(()=>tell(frames[screen],m),250); }
  const next=PREFETCH[screen]; if(NOPREFETCH||!next||frames[next]) return;
  /* Today first: the CRM prefetch (three.js + a 3D roof) used to start 1.5 s after the Today frame loaded, while its map was
     still drawing; on a slow GPU that starved the map. Now it waits until Today's map is ready (or 12 s), then for idle. */
  const mapDone=()=>{ if(screen!=='daily') return true; try{ const w=frames[screen].el.contentWindow; return !!(w&&w.__mapReady); }catch(e){ return true; } };
  const t0=performance.now();
  const tryPrefetch=()=>{ if(cur!==screen||frames[next]) return; if(!mapDone()&&performance.now()-t0<12000){ setTimeout(tryPrefetch,500); return; }
    idle(()=>{ if(cur!==screen||frames[next]) return; const fr=frameFor(next); load(fr,srcFor(next,{})); }); };
  setTimeout(tryPrefetch,1500);
}
const idle=f=>window.requestIdleCallback?requestIdleCallback(f,{timeout:4000}):setTimeout(f,0);
addEventListener('hashchange',render);

/* the opening hands off on its own to Today, then Nimbus gives the morning brief */
let pendingBrief=false;
function sayBrief(){ pendingBrief=false; setTimeout(()=>Nimbus.say(Nimbus.brief(),8000),400); }
function onIntroDone(){
  if(cur!=='opening') return;
  ss.set('rc.introSeen','1');
  go('daily',{},true);
  if(!Nimbus.isArrived()) Nimbus.arrive(null);
  if(!briefed){ briefed=true; const fr=frames.daily; if(fr&&fr.loaded) sayBrief(); else pendingBrief=true; }   // the brief states the real queue, so it waits for the Daily 50
}
addEventListener('message',e=>{ if(e.origin!==location.origin) return; const d=e.data||{};
  if(d.type==='intro-done') onIntroDone();
  else if(d.type==='routed'){ Object.values(frames).forEach(fr=>{ if(fr.routeAck===d.token) fr.routeAck=null; }); }
  else if(d.type==='route'&&screens[d.screen]) syncRoute(d.screen,d.params||{});
  else if(d.type==='go'&&screens[d.screen]) go(d.screen,d.params||{});
  else if(d.type==='nimbus-say'&&d.text) Nimbus.say({t:String(d.text).slice(0,160),m:d.mood||'calm',k:d.label||'Nimbus'},6500);
});

const narrow=matchMedia('(max-width:599px)');
ORDER.forEach(id=>{const b=document.createElement('button');b.dataset.screen=id;b.textContent=screens[id].label;b.onclick=()=>go(id,{});nav.appendChild(b)});
narrow.addEventListener('change',()=>setTimeout(Nimbus.place,50));
/* ?mode=phone: a phone-sized stage inside a desktop window (capture tooling only; no toggle in the app) */
function setMode(phone){main.classList.toggle('phone',phone);document.body.classList.toggle('nb-phone',phone);setTimeout(Nimbus.place,320);}
stage.addEventListener('transitionend',Nimbus.place);
Nimbus.init({go:(screen,params)=>go(screen,params)});
/* the roofer: Jackson Roofing (lib/brand.js); ?roofer=<key> is kept on this device by lib/rc-state.js */
(function(){ if(!window.ROOFERS) return; const r=activeRoofer(); coName.textContent=r.name; me.textContent=r.owner[0]; me.title=r.owner;
  document.documentElement.style.setProperty('--roofer',r.accent); rooferMark(document.querySelector('header .co .mark'),r);
  document.title=r.name+' | Roof Command';
  const area=()=>{ coArea.textContent=(narrow.matches?'':'Roof Command, ')+r.area; }; area(); narrow.addEventListener('change',area); addEventListener('rc-area',area); })();
/* Find an address or storm: the search runs inside the screen that owns the data.
   Storms geocodes inside the loaded counties and picks storms by date; Today filters the queue.
   From any other screen the query opens Storms. On a phone the icon opens the Storms search box. */
const findIn=document.getElementById('findIn'),findBox=document.getElementById('find');
let pendingFind=null;
function findTarget(){ return cur==='daily'&&!narrow.matches?'daily':'storm'; }
function sendFind(msg){ const t=findTarget(); const fr=frames[t]; if(cur!==t||!fr||!fr.loaded){ pendingFind=msg; go(t,{}); return; } tell(fr,msg); }
findIn.addEventListener('input',()=>{ const q=findIn.value; if(q.trim().length<2){ sendFind({type:'find-close'}); return; } sendFind({type:'find',q}); });
findIn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Escape'){ e.preventDefault(); if(findIn.value.trim().length<2&&e.key!=='Escape') return; sendFind({type:'find-key',key:e.key}); if(e.key==='Enter'||e.key==='Escape'){ findIn.value=''; findIn.blur(); } } });
findIn.addEventListener('blur',()=>setTimeout(()=>{ if(document.activeElement!==findIn){ const fr=frames[findTarget()]; if(fr) tell(fr,{type:'find-close'}); } },200));
findBox.addEventListener('click',()=>{ if(getComputedStyle(findIn).display==='none'){ sendFind({type:'find-open'}); } });
if(q.get('mode')==='phone') setMode(true);

/* keyboard: 1 to 4 switch screens, Ctrl K opens search (Find an address, or Nimbus on phone) */
addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')||(e.target&&e.target.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(getComputedStyle(findIn).display==='none') sendFind({type:'find-open'}); else { findIn.focus(); findIn.select(); } return; }
  if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
  const n=parseInt(e.key,10); if(n>=1&&n<=ORDER.length) go(ORDER[n-1],{});
});
/* first paint (after sign-in, lib/auth.js): ?tab= deep link, else the hash, else the opening once per session, else Today */
RCT_AUTH.gate(function start(){
  const tab=ALIAS[q.get('tab')]||q.get('tab');
  if(tab&&screens[tab]&&!location.hash){ go(tab,tab==='opening'?{about:'1'}:{},true); return; }
  if(location.hash&&parseHash(location.hash)){ const r=parseHash(location.hash); if(r.screen==='opening'&&!r.params.about&&(NOINTRO||ss.get('rc.introSeen'))){ go('daily',{},true); return; } render(); return; }
  if(NOINTRO||ss.get('rc.introSeen')){ go('daily',{},true); return; }
  go('opening',{},true);
});
</script>
<script>/* offline cache (sw.js): repeat visits and tab switches load from disk. Registered after the first screen is up; ?nosw=1 removes it. */
if('serviceWorker' in navigator){ if(/[?&]nosw=1/.test(location.search)) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  else addEventListener('load',()=>setTimeout(()=>(window.requestIdleCallback||setTimeout)(()=>{ if(RCT_AUTH.ok()) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}); },{timeout:5000}),1000)); }</script>
